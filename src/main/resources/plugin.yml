name: HardcoreRouletteClasses
version: 0.11.1
main: dev.math.hrclasses.HardcoreRouletteClasses
api-version: "26.3"
author: matheus-fsc
website: https://github.com/matheus-fsc/hardcore-roulette-addon-classes
description: Habilidades por nivel (Engenharia, Exploracao, Plantacao) para servidores hardcore em grupo.
softdepend: [HardcoreRoulette, AuraSkills]
commands:
  classe:
    description: Abre o menu de habilidades
    usage: /classe [info|particulas|admin <jogador> <nivel> [exploracao|plantacao]|dar <item>|give <engenheiro|explorador|plantador|livros> [jogador]]
    aliases: [classes, class, engenharia, habilidades]
permissions:
  hrclasses.admin:
    description: Comandos de administracao (admin, dar, give)
    default: op

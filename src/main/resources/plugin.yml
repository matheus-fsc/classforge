name: Classforge
version: 0.14.0
main: dev.math.classforge.Classforge
api-version: "26.3"
author: matheus-fsc
website: https://github.com/matheus-fsc/classforge
description: Habilidades por nivel (Engenharia, Exploracao, Plantacao) sem classes fixas. Integra com o HardcoreRoulette.
softdepend: [HardcoreRoulette, AuraSkills]
commands:
  classe:
    description: Abre o menu de habilidades
    usage: /classe [info|particulas|reload|report|admin <jogador> <nivel> [exploracao|plantacao]|dar <item>|give <engenheiro|explorador|plantador|livros> [jogador]]
    aliases: [classes, class, classforge, engenharia, habilidades]
permissions:
  classforge.admin:
    description: Comandos de administracao (admin, dar, give, reload, report)
    default: op
